server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real HTTP integration: the ui container proxies API calls to the
    # circuit container over the compose network.
    location /api/ {
        proxy_pass http://circuit:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
